# Reusable guard for every repo that uses dstack. Call it from the repo's CI:
#   jobs:
#     guard:
#       uses: dsickles/dstack/.github/workflows/guard.yml@main
# It stays self-contained: it runs in the caller's checkout, not dstack's.
# The ticket prefix comes from the caller's .dstack/config.json (`ticket_prefix`); without
# one, any upper-case key is accepted. tests/test_guard_workflow.py keeps the patterns
# below in sync with lib/rules.py and runs the title script.
name: guard

on:
  workflow_call:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: "8.30.1"
  PR_TITLE_TEMPLATE: '^(feat|fix|chore|docs|refactor|test|perf|build|ci|style|revert)(\([a-z0-9._/-]+\))?!?: \S.* \(PREFIX-\d+\)$'
  ANY_PREFIX: '[A-Z][A-Z0-9]*'
  AUTOMATION_PR_PATTERN: '^chore\([a-z0-9-]+\): \S'

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Scan new commits
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            range="-1 $HEAD"
          else
            range="$BASE..$HEAD"
          fi
          gitleaks git --log-opts="$range" --redact --no-banner -v .

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .dstack
      - name: Check PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'EOF'
          import json, os, re, sys
          title = os.environ["TITLE"]
          try:
              prefix = json.load(open(".dstack/config.json", encoding="utf-8")).get("ticket_prefix", "")
          except (OSError, ValueError, AttributeError):
              prefix = ""
          prefix = prefix.strip() if isinstance(prefix, str) else ""
          key = re.escape(prefix) if prefix else os.environ["ANY_PREFIX"]
          pattern = os.environ["PR_TITLE_TEMPLATE"].replace("PREFIX", key)
          if re.match(pattern, title) or re.match(os.environ["AUTOMATION_PR_PATTERN"], title):
              sys.exit(0)
          shown = prefix or "ABC"
          print(f"PR title must be `type: summary ({shown}-n)`, e.g. `feat: add menu ({shown}-66)`. Got: {title}")
          sys.exit(1)
          EOF
